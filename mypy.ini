[mypy]
# Per-file typing rollout: each module is typed on its own daily-iteration day
# (Day 15 kraken_client, Day 16 trader, …). Intent: mypy reads transitive
# imports for inference but doesn't report errors in them, so each day's
# target file only surfaces its own errors.
#
# As of Day 66 (mypy 1.19.1), follow_imports=silent no longer suppresses
# errors found in transitively-imported first-party modules the way it used
# to — a mypy version bump silently turned this into a no-op for that case,
# and two latent errors in config.py/notifier.py surfaced as failing tests
# with no code change of their own. Left the setting in place (it still
# governs other things, e.g. not requiring stubs for every import), but
# don't rely on it for per-day isolation anymore: fixing an error a
# transitively-imported module surfaces is now unavoidable the same day,
# not deferrable to that module's own numbered day.
follow_imports = silent
ignore_missing_imports = True
