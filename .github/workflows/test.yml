name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      # market_matcher.py instantiates anthropic.Anthropic(api_key=...) at
      # import time. The tests mock all network calls but the SDK
      # constructor still validates that an api_key is present, so we
      # pass a placeholder. These are never real secrets.
      ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
      KRAKEN_API_KEY: ci-placeholder-not-a-real-key
      KRAKEN_PRIVATE_KEY: Y2ktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1rZXk=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage gate
        # Day 83: fails the build if overall coverage (scope per .coveragerc —
        # tests/, venv/, site-packages excluded) drops below the threshold.
        #
        # Day 94: raised 95 -> 96. Real coverage has held at 98%+ since Day 81
        # (98.18% as of Day 93, 478 tests) with no sign of dropping — Day 83's
        # original 95 was set against a 98% baseline for 3 points of headroom;
        # this keeps roughly the same buffer against the current baseline
        # rather than leaving the gate static while real coverage climbed.
        #
        # Day 112: raised 96 -> 97. Real coverage climbed further and held at
        # 99%+ for the two+ weeks since Day 94 (99.16% from Day 95 through
        # Day 109, 99.44% on Day 110, 99.58% as of Day 111/502 tests) — the
        # same "genuinely improved and stayed there" condition Day 94's own
        # comment names, verified again rather than assumed: a synthetic drop
        # (temporarily removing tests/test_trader_coverage_gaps.py) failed
        # the gate as expected (96.50%, below 97) before this change landed.
        #
        # Raise this number when coverage genuinely improves and stays there
        # for a few days — never lower it to make a failing PR pass. If a
        # legitimate change needs new, not-yet-tested code (a fresh module,
        # a large refactor mid-flight), that's a signal to add tests in the
        # same PR, not to loosen the gate.
        run: pytest -v --cov=. --cov-report=term-missing --cov-fail-under=97

      - name: Dependency vulnerability scan (pip-audit)
        # Day 104: the 8 --ignore-vuln entries this step carried since Day 58
        # were all tied to package versions this repo no longer pins — the
        # Day 86/89/90/97 dependency bumps moved every one of them (requests,
        # urllib3, python-dotenv, pytest, msgpack, filelock) past the affected
        # range. A clean `pip-audit -r requirements.txt` run with zero
        # --ignore-vuln flags confirmed none of the 8 IDs (or anything else)
        # still applies, so the flags were removed rather than left as dead
        # weight — see SECURITY.md section 5 for the full re-audit. Add a new
        # --ignore-vuln only for a real, currently-applicable advisory with no
        # published fix (same procedure as before).
        run: pip-audit -r requirements.txt
