name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    env:
      # market_matcher.py instantiates anthropic.Anthropic(api_key=...) at
      # import time. The tests mock all network calls but the SDK
      # constructor still validates that an api_key is present, so we
      # pass a placeholder. These are never real secrets.
      ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
      KRAKEN_API_KEY: ci-placeholder-not-a-real-key
      KRAKEN_PRIVATE_KEY: Y2ktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1rZXk=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage gate
        # Day 83: fails the build if overall coverage (scope per .coveragerc —
        # tests/, venv/, site-packages excluded) drops below the threshold.
        # 98% as of Day 81; 95% leaves headroom for normal small additions
        # while still catching a real regression (e.g. a skipped test file,
        # which drops coverage by several points in one move).
        #
        # Raise this number when coverage genuinely improves and stays there
        # for a few days — never lower it to make a failing PR pass. If a
        # legitimate change needs new, not-yet-tested code (a fresh module,
        # a large refactor mid-flight), that's a signal to add tests in the
        # same PR, not to loosen the gate.
        run: pytest -v --cov=. --cov-report=term-missing --cov-fail-under=95

      - name: Dependency vulnerability scan (pip-audit)
        # --ignore-vuln entries are advisories with no published fix version
        # yet (checked against real PyPI, not just pip-audit's feed) — see
        # SECURITY.md section 5 for the ID -> reasoning -> revisit-date table.
        # Anything with a real fix available fails the build.
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-2275 \
            --ignore-vuln PYSEC-2026-142 \
            --ignore-vuln PYSEC-2026-141 \
            --ignore-vuln PYSEC-2026-2270 \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln GHSA-6v7p-g79w-8964 \
            --ignore-vuln PYSEC-2026-1375 \
            --ignore-vuln PYSEC-2026-1374
